version: 1.0

runtime: python311

build:
  commands:
    build:
      - echo "=== Installing dependencies for build ==="
      - python3 -m pip install --upgrade pip
      - python3 -m pip install --no-cache-dir -r requirements-web.txt
      - echo "=== Build dependencies installed ==="

run:
  pre-run:
    - echo "=== Installing dependencies for runtime ==="
    - python3 -m pip install --upgrade pip
    - python3 -m pip install --no-cache-dir -r requirements-web.txt
    - echo "=== Runtime dependencies installed ==="
    - echo "=== Verifying FastAPI is available ==="
    - python3 -c "import fastapi; print('FastAPI available at runtime')"
  command: python3 web_server.py
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"
