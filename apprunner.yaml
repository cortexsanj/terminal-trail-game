version: 1.0

runtime: python311

build:
  commands:
    build:
      - echo "=== Installing dependencies ==="
      - python3 -m pip install --upgrade pip
      - python3 -m pip install --no-cache-dir -r requirements-web.txt
      - echo "=== Verifying installation ==="
      - python3 -c "import fastapi; print('FastAPI installed successfully')"
      - python3 -c "import uvicorn; print('Uvicorn installed successfully')"
      - echo "=== Checking game files ==="
      - ls -la
      - test -d challenges && echo "challenges folder found" || echo "challenges folder missing"
      - test -d assets && echo "assets folder found" || echo "assets folder missing"
      - echo "=== Build complete ==="

run:
  command: python3 web_server.py
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"
